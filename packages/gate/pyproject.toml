[project]
name = "kindred-gate"
version = "0.1.0"
description = "Knowledge gate: gated retrieval, classifier, auditor and the audited turn"
authors = [
    { name = "Rishikesh", email = "rishikeshvk2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kindred-contracts",
    "kindred-db",
    "kindred-llm",
    "sqlalchemy>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
kindred-contracts = { workspace = true }
kindred-db = { workspace = true }
kindred-llm = { workspace = true }
