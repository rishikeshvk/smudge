[project]
name = "kindred-db"
version = "0.1.0"
description = "Kindred database models and engine"
authors = [
    { name = "Rishikesh", email = "rishikeshvk2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
