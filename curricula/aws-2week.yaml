      - {term: ec2:RunInstances, kind: api_name}
    notes:
      - body: |
          Day 11, finally onto EC2! Amazon EC2 = Elastic Compute Cloud. It's basically renting virtual servers, and
          AWS calls each one an "instance". So when people say "spin up an instance" they mean start a VM in AWS.
  
          To make an instance you need two big choices:
  
          1. An AMI (Amazon Machine Image). It's the template the instance starts from: the operating system plus
             whatever software is baked in. You can't launch without one. AMIs come from AWS, the community, other
             accounts sharing them, the AWS Marketplace (some cost money), or ones you make yourself.
          2. An instance type, which fixes how much CPU, memory and network you get (more on that in my other note).
  
          AMI gotchas I wrote down:
          - AMIs are Region-specific. The "same" Amazon Linux image has a different AMI ID in each Region, so a
            tutorial's AMI ID won't work if I'm in a different Region. To use your own AMI elsewhere you copy it.
          - They're tied to a CPU architecture. An x86_64 AMI won't run on a Graviton (Arm) instance type and vice
            versa.
  
          Default Linux choice right now is Amazon Linux 2023. Amazon Linux 2 hit end of support on 2026-06-30,
          so any tutorial still using AL2 is out of date. AL2023 is supported until around June 2029.
  
          Launching: the console has a "Launch instance" wizard (CLI equivalent is `aws ec2 run-instances`). The
          top of the wizard is name, AMI and instance type, which I get now. Below that there are more sections
          I'll get to over the next days (networking & connecting is tomorrow, storage is day 13, and there's an
          "advanced details" section too). For today I'm just leaving those alone.
        shaky:
          - "An AMI ID being different per Region for the 'same' image still feels weird. Is it literally a copy in each Region?"
          - "I'm not totally sure how I'd notice I picked an x86 AMI for a Graviton type. Does the wizard stop me or does the launch just fail?"
        sources:
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIs.html
          - https://aws.amazon.com/amazon-linux-2/faqs/
      - body: |
          Instance type names look like gibberish but they decode: series + generation + options, then a dot, then
          size.
  
          - `t3.micro` = T series (burstable), generation 3, size micro.
          - `t4g.small` = burstable, gen 4, g = Graviton (AWS's Arm chips).
          - `c7i-flex.large` = C (compute optimized), gen 7, i = Intel, Flex.
          - `m7i-flex.large` = M (general purpose), gen 7, Intel, Flex.
  
          Series letters worth remembering: M general purpose, C compute, R memory, T burstable. There are also
          storage, GPU and AI-chip series but I only skimmed those. Option letters: a = AMD, g = Graviton, i = Intel,
          n = network-heavy.
  
          Sizes (nano, micro, small, medium, large, xlarge, 2xlarge...) are relative inside a family. A "large" in
          one family isn't the same as a "large" in another.
  
          Burstable (T) instances: they earn CPU credits while idle and spend them when busy. The part that
          surprised me: T3, T3a, T4g and T8i launch in "unlimited" mode by default, so if the CPU stays high for a
          long time you can get charged extra instead of just being slowed down. Good to know before leaving
          something running flat out.
  
          Free Tier (ties back to day 2): for new accounts the eligible types are t3.micro, t3.small, t4g.micro,
          t4g.small, c7i-flex.large and m7i-flex.large. Loads of older tutorials say "use t2.micro, it's free", but
          that's only for legacy accounts made before July 2025. You can filter for eligible types with
          `aws ec2 describe-instance-types --filters Name=free-tier-eligible,Values=true`.
  
          For our practice I'd probably pick t3.micro (x86) or t4g.micro (Graviton, but then I need an Arm AMI).
        shaky:
          - "CPU credits confuse me. If unlimited mode is the default, when do the credits actually matter to my bill?"
          - "I keep reading that micro/small/large are relative, but I can't tell how much bigger a large is than a micro without looking it up every time."
        sources:
          - https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-type-names.html
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/burstable-performance-instances-unlimited-mode.html
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-free-tier-usage.html
  
  - slug: ec2-network-access
    day: 12
    title: EC2 networking & connecting
    prerequisites: [ec2-basics]
    audit_brief: >-
      Covers minimal EC2 networking and connecting. Every Region has a default VPC with
      a public subnet per AZ and an internet gateway; an instance lives in one subnet in one AZ. Public
      IPv4 addresses cost USD 0.005/hour; an Elastic IP is a fixed public IPv4. Security groups are virtual firewalls:
      allow-only rules, stateful (return traffic allowed), a new group has no inbound rules and allows all outbound.
      Rules are protocol + port + source (CIDR such as 0.0.0.0/0 or /32, or another security group). Ports: 22 SSH,
      80 HTTP, 443 HTTPS, 3389 RDP. Network ACLs are subnet-level and stateless. Key pairs: AWS puts the public key
      in ~/.ssh/authorized_keys on Linux and keeps no copy of the private key. Connect via SSH as ec2-user, EC2
      Instance Connect (needs IAM permissions), or Session Manager (no inbound port or key pair). Timeout vs
      "Permission denied (publickey)" diagnostics.
    vocabulary:
      - {term: VPC, kind: abbreviation}
      - {term: Virtual Private Cloud, kind: synonym}
      - {term: default VPC, kind: term}
      - {term: subnet, kind: term, everyday: true}
      - {term: public subnet, kind: term}
      - {term: internet gateway, kind: term}
      - {term: CIDR, kind: abbreviation}
      - {term: public IP, kind: term, everyday: true}
      - {term: public IPv4 address, kind: term}
      - {term: private IP, kind: term, everyday: true}
      - {term: Elastic IP, kind: term}
      - {term: EIP, kind: abbreviation}
      - {term: security group, kind: term}
      - {term: SG, kind: abbreviation, everyday: true}
      - {term: inbound rule, kind: term}
      - {term: outbound rule, kind: term}
      - {term: ingress, kind: term, everyday: true}
      - {term: egress, kind: term, everyday: true}
      - {term: stateful, kind: term, everyday: true}
      - {term: network ACL, kind: term}
      - {term: NACL, kind: abbreviation}
      - {term: port, kind: term, everyday: true}
      - {term: 0.0.0.0/0, kind: api_name}
      - {term: My IP, kind: term}
      - {term: authorize-security-group-ingress, kind: api_name}
      - {term: AuthorizeSecurityGroupIngress, kind: api_name}
      - {term: create-security-group, kind: api_name}
      - {term: key pair, kind: term}
      - {term: public key, kind: term, everyday: true}
      - {term: private key, kind: term, everyday: true}
      - {term: .pem, kind: api_name}
      - {term: SSH, kind: abbreviation}
      - {term: authorized_keys, kind: api_name}
      - {term: ec2-user, kind: api_name}
      - {term: EC2 Instance Connect, kind: term}
      - {term: EC2 Instance Connect Endpoint, kind: term}
      - {term: Session Manager, kind: term}
      - {term: AWS Systems Manager, kind: term}
      - {term: SSM, kind: abbreviation}
      - {term: RDP, kind: abbreviation}
    notes:
      - body: |
          Networking & connecting day. I only need the minimum here, not real network design.
  
          Default VPC: every Region comes with one already set up, with a public subnet in each Availability Zone,
          an internet gateway and DNS turned on. That's why you can launch an instance straight away without
          building any network. An instance sits in one subnet, and a subnet is in one AZ.
  
          Public IPs: a public IPv4 address costs USD 0.005 per hour now, whether it's in use or idle. So "public
          IPs are free" is old info. If I want a fixed public address I can get an Elastic IP. I read that the
          normal public IP isn't guaranteed to stick around, but when exactly it changes is lifecycle stuff for
          day 13.
  
          Security groups = virtual firewall attached to the instance's network interface. Key facts:
          - Rules are allow-only. There's no "deny" rule at all.
          - A brand new SG has no inbound rules (so nothing can get in) and one outbound rule allowing everything.
          - Stateful: if a request is allowed in, the reply is allowed out automatically. No outbound rule needed
            for the response.
          - An instance can have several SGs; their rules just add up. Changes apply immediately.
          - If you don't pick one, the VPC's default SG gets used.
          - A rule = protocol + port range + source. Source can be a CIDR, or another security group.
          - SGs themselves are free.
  
          Ports to remember: 22 SSH, 80 HTTP, 443 HTTPS, 3389 RDP (Windows remote desktop). `0.0.0.0/0` means
          anywhere; `/32` means exactly one IP. The console has a "My IP" option, which is way better than opening
          SSH to 0.0.0.0/0 like lots of tutorials do.
  
          Network ACLs also exist: they're at the subnet level and stateless. Just awareness, not going deeper.
        shaky:
          - "Since SGs can't deny, I can't just block one bad IP with them. Apparently that's what a network ACL is for, but I haven't really looked into NACLs."
          - "Using another security group as a source (meaning 'instances in that group') is still pretty abstract to me."
          - "I'm fuzzy on exactly when the USD 0.005/hr public IPv4 charge applies. Only while the address is attached?"
        sources:
          - https://docs.aws.amazon.com/vpc/latest/userguide/default-vpc.html
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html
          - https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html
          - https://aws.amazon.com/vpc/pricing/
      - body: |
          Connecting to an instance. Key pairs first: a key pair is a public key plus a private key. On a Linux
          instance the public key ends up in `~/.ssh/authorized_keys` at first boot, and I keep the private key.
          AWS keeps NO copy of the private key, so if I lose it there's no recovery. On Windows the private key is
          used to decrypt the Administrator password instead.
  
          Ways to connect (from the "connect" docs page):
          - Plain SSH client: needs an inbound rule for port 22 and the key pair. On Amazon Linux the username is
            `ec2-user`.
          - EC2 Instance Connect: from the browser or CLI. Needs the inbound rule plus IAM permissions (day 5
            stuff) and some software on the instance, but no key pair to manage myself.
          - Session Manager (part of AWS Systems Manager): no inbound port and no key pair at all, which sounds
            nicest. It needs some IAM setup too, and I haven't figured out what exactly.
          - EC2 Instance Connect Endpoint for instances with only a private IP, and RDP for Windows.
  
          Troubleshooting pair I want to remember:
          - Connection times out = network problem: security group doesn't allow my IP on port 22, or there's no
            public IP to reach.
          - "Permission denied (publickey)" = I reached the machine but used the wrong key or wrong username.
  
          Also SSH apparently refuses a private key file whose permissions are too open. I'd need to lock the file
          down, though I haven't checked the exact setting AWS recommends.
        shaky:
          - "Why do Instance Connect and Session Manager need IAM at all just to open a terminal? I get it for the AWS API, less for logging in."
          - "Not sure what file permissions my private key file should have; I just know SSH complains when they're too open."
        sources:
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-key-pairs.html
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect.html
  
  - slug: ec2-storage-lifecycle
    day: 13
    title: EC2 storage & instance lifecycle
    prerequisites: [ec2-basics, account-billing]
    audit_brief: >-
      Covers EC2 storage and instance states/billing. EBS (Elastic Block Store) volumes are network-attached block
      storage that persists independently and must be in the same AZ as its instance; types gp3/gp2, io2/io1,
      st1, sc1; billed for provisioned size even when the instance is stopped. Snapshots are point-in-time backups used
      to restore or move data across AZs/Regions. Instance store is temporary host disk, lost on stop, hibernate or
      terminate. DeleteOnTermination: root volume deleted on terminate by default, other volumes kept. EBS encryption by
      default is opt-in per Region (aws/ebs key). States pending, running, stopping, stopped, shutting-down,
      terminated; compute billed only while running, per second with a 60-second minimum. Stop/start gets a new public
      IPv4 unless Elastic IP; hibernate saves RAM to the root volume; terminate is irreversible. Purchasing:
      On-Demand, Savings Plans and Reserved Instances (1 or 3 years), Spot (2-minute
      interruption notice); Free plan excludes Savings Plans and RIs.
    vocabulary:
      - {term: Amazon EBS, kind: term}
      - {term: EBS, kind: abbreviation}
      - {term: Elastic Block Store, kind: synonym}
      - {term: EBS volume, kind: term}
      - {term: volume, kind: term, everyday: true}
      - {term: root volume, kind: term}
      - {term: block storage, kind: term}
      - {term: block device mapping, kind: term}
      - {term: gp3, kind: api_name}
      - {term: gp2, kind: api_name}
      - {term: io2, kind: api_name}
      - {term: io1, kind: api_name}
      - {term: st1, kind: api_name}
      - {term: sc1, kind: api_name}
      - {term: IOPS, kind: abbreviation}
      - {term: snapshot, kind: term, everyday: true}
      - {term: EBS snapshot, kind: term}
      - {term: instance store, kind: term}
      - {term: ephemeral storage, kind: synonym}
      - {term: DeleteOnTermination, kind: api_name}
      - {term: aws/ebs, kind: api_name}
      - {term: instance state, kind: term}
      - {term: stop, kind: term, everyday: true}
      - {term: start, kind: term, everyday: true}
      - {term: reboot, kind: term, everyday: true}
      - {term: hibernate, kind: term, everyday: true}
      - {term: terminate, kind: term, everyday: true}
      - {term: termination protection, kind: term}
      - {term: per-second billing, kind: term}
      - {term: On-Demand, kind: term, everyday: true}
      - {term: On-Demand Instance, kind: term}
      - {term: Savings Plans, kind: term}
      - {term: Reserved Instance, kind: term}
      - {term: RI, kind: abbreviation, everyday: true}
      - {term: Spot, kind: term, everyday: true}
      - {term: Spot Instance, kind: term}
      - {term: Dedicated Host, kind: term}
      - {term: Dedicated Instance, kind: term}
      - {term: Capacity Reservation, kind: term}
      - {term: stop-instances, kind: api_name}
    notes:
      - body: |
          Storage & instance lifecycle day. Storage first.
  
          EBS (Elastic Block Store): network-attached block storage that you use like a hard drive. The big thing:
          an EBS volume lives on independently of the instance, and it has to be in the same AZ as the instance
          it's attached to. You can attach several volumes to one instance. Contrast with S3 (days 7-10): S3 is
          object storage you reach over the API, EBS is a disk the instance's OS sees.
  
          Volume types: gp3/gp2 (General Purpose SSD, the normal choice), io2/io1 (Provisioned IOPS SSD), st1
          (throughput HDD), sc1 (cold HDD). Data is replicated within the AZ.
  
          Snapshots: point-in-time backups of a volume that persist independently. You use them to restore a volume
          or to move data to another AZ, Region or account.
  
          Instance store: temporary disks physically on the host machine. Data is gone on stop, hibernate or
          terminate. Fine for scratch data, never for anything I care about.
  
          DeleteOnTermination: by default the root volume is deleted when the instance is terminated, but extra
          volumes are kept. So extra volumes can hang around after the instance is gone.
  
          Billing: EBS bills for the provisioned size, even when the instance is stopped. So "I stopped it, it's
          free now" is wrong.
  
          Encryption contrast with day 9: S3 encrypts every new upload automatically (SSE-S3), but EBS encryption
          by default is an opt-in setting per Region (uses the `aws/ebs` key). Opposite defaults, easy to mix up.
        shaky:
          - "Block vs object storage: I get the definitions, but I'm not confident picking between EBS and S3 for a real app."
          - "Orphaned extra volumes still billing after terminate worries me. How would I even notice them?"
        sources:
          - https://docs.aws.amazon.com/ebs/latest/userguide/what-is-ebs.html
          - https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html
          - https://docs.aws.amazon.com/ebs/latest/userguide/encryption-by-default.html
      - body: |
          Lifecycle. States: pending, running, stopping, stopped (then start takes it back to pending), and
          shutting-down, terminated. Compute is billed only while running (and while stopping if you're
          hibernating). Billing is per second with a 60-second minimum each time it starts. A reboot doesn't start a
          new billing period.
  
          My cheat table:
          - Reboot: same host, keeps public IPv4, keeps instance store, RAM erased, root volume kept.
          - Stop/start: may move host, gets a NEW public IPv4 (unless it's an Elastic IP), instance store lost,
            RAM erased, root volume kept.
          - Hibernate: like stop, but RAM is saved to the EBS root volume.
          - Terminate: public IP released, instance store lost, root volume deleted by default. Irreversible!
  
          Private IPv4, Elastic IPs and IPv6 are kept across reboot, stop and hibernate. Termination protection
          blocks terminating from the console/API. If you run `shutdown` inside the OS on an EBS-backed instance,
          the default behaviour is stop, not terminate.
  
          Purchasing options:
          - On-Demand: per second, no commitment.
          - Savings Plans: commit to a USD/hour spend for 1 or 3 years.
          - Reserved Instances: commit to an instance config + Region for 1 or 3 years.
          - Spot: spare capacity, big discount, can be interrupted with a 2-minute notice. Not an auction anymore;
            setting a max price is optional and apparently causes more interruptions.
          - Dedicated Hosts/Instances and Capacity Reservations exist, skimmed only.
  
          The Free plan doesn't include Savings Plans or RIs anyway, so if we're on it those two are off the table.
        shaky:
          - "Savings Plans vs Reserved Instances: both are 1 or 3 year commitments and I keep blurring which one is spend-based and which is config-based."
          - "A stop/start hands out a new public IPv4, so any SSH command or bookmark with the old address breaks. An Elastic IP fixes that, but it still bills while it sits there, so it's not a free fix."
        sources:
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-instance-termination-notices.html
          - https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/free-tier-plans.html
  
  - slug: ec2-roles-metadata
    day: 14
    title: User data, instance metadata & roles for EC2
    prerequisites: [iam-roles, s3-access, ec2-network-access]
    audit_brief: >-
      Capstone. User data is a script or cloud-init config passed at launch; on Linux it runs as root, once at first
      boot by default, is base64-encoded with a 16 KB raw limit, logs to /var/log/cloud-init-output.log, can only be
      changed while stopped and isn't copied into AMIs. The Instance Metadata Service (IMDS) at 169.254.169.254 serves
      instance ID, AMI ID, network info, user data and temporary role credentials; IMDSv2 is session-based (PUT
      /latest/api/token, then the X-aws-ec2-metadata-token header) to defend against SSRF; it is the default for
      Quick Start launches since Nov 2023, account-level default since Mar 2024, and AL2023. IAM roles for EC2 replace
      stored access keys: the role is delivered via an instance profile holding exactly one role (console auto-creates
      it; CLI uses create-instance-profile and add-role-to-instance-profile), one role per instance, attachable to a
      running instance, trust policy trusts ec2.amazonaws.com. SDKs fetch auto-rotated credentials. Session Manager
      needs an instance profile role.
    vocabulary:
      - {term: user data, kind: term}
      - {term: user data script, kind: term}
      - {term: cloud-init, kind: term}
      - {term: "#cloud-config", kind: api_name}
      - {term: /var/log/cloud-init-output.log, kind: api_name}
      - {term: instance metadata, kind: term}
      - {term: IMDS, kind: abbreviation}
      - {term: Instance Metadata Service, kind: synonym}
      - {term: IMDSv1, kind: abbreviation}
      - {term: IMDSv2, kind: abbreviation}
      - {term: 169.254.169.254, kind: api_name}
      - {term: /latest/meta-data/, kind: api_name}
      - {term: /latest/api/token, kind: api_name}
      - {term: X-aws-ec2-metadata-token, kind: api_name}
      - {term: HttpTokens, kind: api_name}
      - {term: hop limit, kind: term}
      - {term: HttpPutResponseHopLimit, kind: api_name}
      - {term: SSRF, kind: abbreviation}
      - {term: server-side request forgery, kind: synonym}
      - {term: modify-instance-metadata-options, kind: api_name}
      - {term: modify-instance-metadata-defaults, kind: api_name}
      - {term: instance profile, kind: term}
      - {term: IAM role for EC2, kind: term}
      - {term: instance role, kind: synonym}
      - {term: ec2.amazonaws.com, kind: api_name}
      - {term: iam:PassRole, kind: api_name}
      - {term: PassRole, kind: api_name}
      - {term: create-instance-profile, kind: api_name}
      - {term: add-role-to-instance-profile, kind: api_name}
      - {term: associate-iam-instance-profile, kind: api_name}
      - {term: security-credentials, kind: api_name}
      - {term: instance identity role, kind: term}
      - {term: credentials provider chain, kind: term}
      - {term: Modify IAM role, kind: term}
    notes:
      - body: |
          Last day! User data and instance metadata first.
  
          User data: a script (or a cloud-init config) you hand the instance at launch. On Linux it runs as root,
          and only once, at first boot, by default. It's base64-encoded and limited to 16 KB before encoding. If it
          goes wrong, the output is in `/var/log/cloud-init-output.log`. You can only change it while the instance
          is stopped, and it isn't copied into AMIs you create from the instance. If the script calls AWS APIs, it
          needs a role on the instance (see my roles note).
  
          Instance metadata: the Instance Metadata Service (IMDS) lives at `169.254.169.254`
          and the instance queries it for info about itself. It serves things like the instance ID, the AMI ID, network info, the user data, and
          temporary credentials for the instance's role. User data is actually served through IMDS, so if you
          disable IMDS you also break user data and the key pair setup from day 12.
  
          IMDSv1 vs IMDSv2: v1 is a plain GET. v2 is session-based: first a PUT to `/latest/api/token` to get a
          token, then send that token in the `X-aws-ec2-metadata-token` header on every request. The point is
          protection against SSRF-type attacks, where some app on the server gets tricked into fetching a URL for an
          attacker.
  
          Defaults are now v2: console Quick Start launches have been IMDSv2-only since Nov 2023, there's been an
          account-level default setting since Mar 2024, instance types released from mid-2024 are v2-only by
          default, and AL2023 uses v2. There's also a hop limit setting; 2 is recommended if containers need it.
        shaky:
          - "I'd definitely have edited user data, rebooted, and wondered why nothing happened. Runs-once-at-first-boot is going to bite me."
          - "SSRF is still pretty abstract to me. I get that the token PUT blocks it, not fully why a simple GET is so much easier to abuse."
          - "User data vs metadata vs tags: I keep mixing up which is which."
        sources:
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/user-data.html
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-IMDS-new-instances.html
          - https://aws.amazon.com/blogs/aws/amazon-ec2-instance-metadata-service-imdsv2-by-default/
          - https://aws.amazon.com/about-aws/whats-new/2024/03/set-imdsv2-default-new-instance-launches/
      - body: |
          Roles for EC2, the capstone that ties IAM, S3 and EC2 together.
  
          Problem: an app on my instance needs to read from S3. Wrong answer: put access keys (day 4) on the
          server. Right answer: attach an IAM role to the instance. Apps using an AWS SDK (or the CLI) then pick up
          temporary, automatically rotated credentials from instance metadata. No `aws configure` on the box.
  
          How the role gets there: through an instance profile, a container that holds exactly one role. The IAM
          console quietly creates a same-named instance profile when you make a role for EC2, which is why you
          barely notice it. With the CLI you do it yourself: `aws iam create-instance-profile` then
          `add-role-to-instance-profile`.
  
          Rules:
          - One role per instance; the same role can be on many instances.
          - You can attach or swap the role on a running instance (`associate-iam-instance-profile`). Swap the
            profile rather than editing the role inside it, because that change can take up to an hour to show up.
          - The role's trust policy (day 6) must trust `ec2.amazonaws.com`.
          - EC2 role credentials rotate, so they're not limited by the role's max session duration.
  
          My capstone scenario: role with a least-privilege policy allowing `s3:ListBucket` and `s3:GetObject` on
          our practice bucket (day 8 actions), attached to a t3.micro. Then `aws s3 ls` works from the instance with
          no keys anywhere.
  
          This also answers my day 12 question: Session Manager needs an instance profile role on the instance
          (plus the SSM agent), which is the IAM setup I hadn't figured out.
  
          Every instance also has an automatic "instance identity role", but that's not for your own apps.
        shaky:
          - "Role vs instance profile: why two separate things if the console hides the difference?"
          - "I keep seeing iam:PassRole come up around launching with a role, but I haven't read that page properly yet."
          - "Presigned URLs made on an instance apparently expire early because the role credentials rotate (around 6 hours?). Not sure of the exact number."
        sources:
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html
          - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
          - https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
          - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect.html
