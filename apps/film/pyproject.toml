[project]
name = "kindred-film"
version = "0.1.0"
description = "Renders and assembles the Smudge demo film"
authors = [
    { name = "Rishikesh", email = "rishikeshvk2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.0",
    "kindred-contracts",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
kindred-contracts = { workspace = true }
