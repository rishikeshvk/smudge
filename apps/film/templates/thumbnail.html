<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="film.css">
<style>
.thumb { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #18151F; }
.thumb .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 70% at 78% 0%, var(--lamp-glow), var(--lamp-glow-end) 70%); }
.words { position: absolute; left: 88px; top: 0; bottom: 0; width: 680px; display: flex; flex-direction: column; justify-content: center; gap: 36px; }
.wordmark { font-size: 44px; line-height: 44px; color: var(--muted); }
.head { margin: 0; font-family: Parkinsans, sans-serif; font-size: 92px; line-height: 96px; letter-spacing: -0.03em; }
.sub { margin: 0; font-size: 30px; line-height: 40px; color: var(--muted); }
.phone { position: absolute; left: 860px; top: 70px; width: 310px; height: 689px; box-sizing: border-box; border: 3px solid var(--line-strong);
  border-radius: 36px; overflow: hidden; box-shadow: 0 24px 64px #000000B3; background: #000 url("$screenshot") top center / 100% auto no-repeat; }
</style></head>
<body><div class="thumb"><div class="glow"></div>
<div class="words">
<div class="wordmark"><span class="smu"><span>smu</span></span><span>dge</span><span class="dot"></span></div>
<p class="head"><span class="light">both lamps </span><span class="bold">on.</span></p>
<p class="sub">a study buddy that’s learning it too.</p>
</div>
<div class="phone"></div>
</div></body></html>
